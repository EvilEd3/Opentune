# OpenTune Videos (the music-video TV app): builds just that app on every push
# that touches it, and publishes it at a fixed address:
#   https://github.com/<owner>/<repo>/releases/download/videotv-latest/OpenTune-Videos.apk
#
# With the signing secrets set (Settings → Secrets and variables → Actions):
#   VIDEOTV_KEYSTORE           the release keystore, base64
#   VIDEOTV_KEYSTORE_PASSWORD  its password (store and key)
# the APK is a signed, optimised release that installs over the previous one.
# Without them it is a debug build, signed with a throwaway key.
name: OpenTune Videos (TV)

on:
  push:
    paths:
      - "videotv/**"
      - "core/**"
      - ".github/workflows/videotv.yml"
  workflow_dispatch:

concurrency:
  group: videotv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      HAS_KEY: ${{ secrets.VIDEOTV_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4

      - name: Unpack the signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.VIDEOTV_KEYSTORE }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/videotv.jks"

      - name: Build the signed release APK
        if: env.HAS_KEY == 'true'
        env:
          OPENTUNE_KEYSTORE: ${{ runner.temp }}/videotv.jks
          OPENTUNE_KEYSTORE_PASSWORD: ${{ secrets.VIDEOTV_KEYSTORE_PASSWORD }}
          OPENTUNE_KEY_ALIAS: videotv
          OPENTUNE_KEY_PASSWORD: ${{ secrets.VIDEOTV_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon :videotv:assembleRelease -PvideotvBuild=${{ github.run_number }}
          cp videotv/build/outputs/apk/release/*.apk "$RUNNER_TEMP/OpenTune-Videos.apk"

      - name: Build the debug APK
        if: env.HAS_KEY != 'true'
        run: |
          ./gradlew --no-daemon :videotv:assembleDebug -PvideotvBuild=${{ github.run_number }}
          cp videotv/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/OpenTune-Videos.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenTune-Videos-TV
          path: ${{ runner.temp }}/OpenTune-Videos.apk

      - name: Publish at the fixed download link
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/videotv'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kind=$([ "$HAS_KEY" = "true" ] && echo "signed release" || echo "debug build (signing secrets not set)")
          gh release delete videotv-latest --yes --cleanup-tag || true
          gh release create videotv-latest "$RUNNER_TEMP/OpenTune-Videos.apk" \
            --target "$GITHUB_SHA" \
            --title "OpenTune Videos (TV) — build ${{ github.run_number }}" \
            --notes "Latest OpenTune Videos for Android TV: $kind, from ${GITHUB_SHA::7}. Download: https://github.com/${{ github.repository }}/releases/download/videotv-latest/OpenTune-Videos.apk" \
            --latest
