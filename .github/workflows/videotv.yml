# OpenTune Videos (the music-video TV app).
#
# Every push that touches it: build, then test on an emulated 1080p TV
# (.github/scripts/videotv-smoke.sh drives it with remote keys, takes
# screenshots and measures smoothness). Results go to the
# `videotv-test-results` branch. Nothing is published by a push.
#
# Publishing is by hand: Actions → OpenTune Videos (TV) → Run workflow, with
# "publish" ticked. The tested APK then goes to the fixed address
#   https://github.com/<owner>/<repo>/releases/download/videotv-latest/OpenTune-Videos.apk
#
# With the signing secrets set (Settings → Secrets and variables → Actions):
#   VIDEOTV_KEYSTORE           the release keystore, base64
#   VIDEOTV_KEYSTORE_PASSWORD  its password (store and key)
# the APK is a signed, optimised release that installs over the previous one.
# Without them it is a debug build, signed with a throwaway key.
name: OpenTune Videos (TV)

on:
  push:
    paths:
      - "videotv/**"
      - "core/**"
      - ".github/workflows/videotv.yml"
      - ".github/scripts/videotv-smoke.sh"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the tested APK to the fixed download link"
        type: boolean
        default: false

concurrency:
  group: videotv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      HAS_KEY: ${{ secrets.VIDEOTV_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1
      - uses: gradle/actions/setup-gradle@v4

      - name: Unpack the signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.VIDEOTV_KEYSTORE }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/videotv.jks"

      - name: Build the signed release APK
        if: env.HAS_KEY == 'true'
        env:
          OPENTUNE_KEYSTORE: ${{ runner.temp }}/videotv.jks
          OPENTUNE_KEYSTORE_PASSWORD: ${{ secrets.VIDEOTV_KEYSTORE_PASSWORD }}
          OPENTUNE_KEY_ALIAS: videotv
          OPENTUNE_KEY_PASSWORD: ${{ secrets.VIDEOTV_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon :videotv:assembleRelease -PvideotvBuild=${{ github.run_number }}
          mkdir -p "$RUNNER_TEMP/out"
          cp videotv/build/outputs/apk/release/*.apk "$RUNNER_TEMP/out/OpenTune-Videos.apk"
          echo "signed release" > "$RUNNER_TEMP/out/kind.txt"

      - name: Build the debug APK
        if: env.HAS_KEY != 'true'
        run: |
          ./gradlew --no-daemon :videotv:assembleDebug -PvideotvBuild=${{ github.run_number }}
          mkdir -p "$RUNNER_TEMP/out"
          cp videotv/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/out/OpenTune-Videos.apk"
          echo "debug build (signing secrets not set)" > "$RUNNER_TEMP/out/kind.txt"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenTune-Videos-TV
          path: ${{ runner.temp }}/out/

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OpenTune-Videos-TV
          path: ${{ runner.temp }}/apk

      - name: Make a 20-minute test clip (a picture and a tone, nothing from YouTube)
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 \
            -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 1200 \
            -c:v libx264 -preset veryfast -crf 32 -pix_fmt yuv420p -g 60 \
            -c:a aac -b:a 96k -movflags +faststart "$RUNNER_TEMP/clip.mp4"
          ls -la "$RUNNER_TEMP/clip.mp4"

      - name: Let the emulator use the CPU's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Drive the app on an emulated 1080p TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/videotv-smoke.sh "${{ runner.temp }}/apk/OpenTune-Videos.apk" "${{ runner.temp }}/results" "${{ runner.temp }}/clip.mp4"

      - name: Show the summary
        if: always()
        run: |
          cat "${{ runner.temp }}/results/summary.txt" || true
          echo "---- smoothness ----"
          cat "${{ runner.temp }}/results/jank.txt" || true

      - name: Save the results to the videotv-test-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "${{ runner.temp }}/results" || exit 0
          cp "${{ runner.temp }}/apk/kind.txt" . 2>/dev/null || true
          echo "${GITHUB_SHA}" > commit.txt
          git init -q
          git checkout -q -b videotv-test-results
          git add -A
          git -c user.name="videotv-test" -c user.email="videotv-test@users.noreply.github.com" \
            commit -q -m "Test results for ${GITHUB_SHA::7} (run ${{ github.run_number }})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:videotv-test-results

  publish:
    needs: [build, test]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenTune-Videos-TV
          path: out
      - name: Publish at the fixed download link
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          kind=$(cat out/kind.txt)
          gh release delete videotv-latest --yes --cleanup-tag || true
          gh release create videotv-latest out/OpenTune-Videos.apk \
            --target "$GITHUB_SHA" \
            --title "OpenTune Videos (TV) — build ${{ github.run_number }}" \
            --notes "Latest OpenTune Videos for Android TV: $kind, from ${GITHUB_SHA::7}, tested on an emulated TV first. Download: https://github.com/${{ github.repository }}/releases/download/videotv-latest/OpenTune-Videos.apk" \
            --latest
